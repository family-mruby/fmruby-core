# Machine definition: a Linux PC where the program is the Wayland compositor
# itself (L8, L9a): wlroots 0.19, nested in another compositor when
# WAYLAND_DISPLAY is set (WSLg, a desktop), on DRM/KMS from a console
# otherwise (WLR_BACKENDS chooses; headless for the tests).
#
# The Family mruby screen is the output over display.scale (L9d): 1280x800
# at scale 2 is a 640x400 screen filling the output, 1920x1080 a 960x540 one
# (an odd pixel left over is black). A portrait output, or one under 426x240
# at that scale, gets the 426x240 screen. The size is taken once, when the
# output comes up; if the output changes later (the nested window resized),
# the screen stays and is laid on it at the largest whole scale that fits.
# A fullscreen app keeps Modern's 426x240 and is shown alone at the largest
# whole scale, centred, black around. Linux windows are Family mruby windows (L9a): each gets the
# Family mruby title bar, frame and close button, and shows through it at
# the output's own resolution; the window manager moves, resizes, stacks and
# focuses them with the other windows. Family mruby's Exit asks them to
# close, and ends the ones still there after a few seconds.
# compositor.autostart starts one Linux program on it
# (--set compositor.autostart=foot).
#
# Needs a build with wlroots 0.19 (rake native:wl, or the amd64 package);
# other builds refuse it with the reason.
# Field reference: native/machine/native_machine.h.
description = "Linux PC: the program as the Wayland compositor (wlroots)"

[screen]
form = "output"              # the output over display.scale

[display]
backend = "wlroots"
scale = 2                    # the output's pixels to one Family mruby pixel
mode = "auto"                # or "WxH": the output's mode (any size on headless and nested)

[input]
backend = "wlroots"          # the compositor's seat: keyboard, touchpad, mouse
ime = "wayland"              # IMEs over input-method-v2 for Linux windows and Family mruby apps (L12b)

[audio]
backend = "sdl"

[desktop]
variant = "mouse"
window_ops = true            # title double-click maximizes, Super+arrows lay windows out (L13)

[system]
services = "linux"
exit_key = "none"
power = ["logind", "exit"]

[files]
host = "auto"
root = "auto"

[compositor]
autostart = ""               # e.g. "foot": started with WAYLAND_DISPLAY set to this compositor
ime = "fcitx5"               # the IME started with it (L12b); not installed: the kana input stays
locker = "swaylock"          # the screen lock program (L13, ext-session-lock); not installed: no Lock entry
