# Settings the installed native package ships (doc/linux_native/, L3c):
# rake native:root stages this, not system_conf_native.toml, as the package's
# first-start /etc/system_conf.toml (and the factory copy). It is the
# development file with what a release wants instead -- keep the two in step
# and the difference to these lines (rake native:root checks it):
#   debug_mode    false (no periodic debug statistics in the log)
#   zenoh_router  empty (the user names their router; nothing is assumed)
#   debugd        false (no remote app control unless the user turns it on;
#                 the package then listens on 127.0.0.1 only)
system_name = "Family mruby OS (Native)"
display_width = 426
display_height = 240
display_margin_x = 0
display_margin_y = 0
default_user_app_width = 386
default_user_app_height = 180
display_mode = "sdl2" # SDL2 window, Linux simulation (ntsc_ipc / spi_direct / headless / tab5_dsi / sdl2 / atom_display)
# How many app slots to hand out. The device targets leave this out and get
# their build ceiling of 9; the hosted builds raise the ceiling to 32
# (hosted/hosted.cmake), and say so here. Anything above the ceiling is
# clamped with a warning at boot.
max_apps = 32
# Where Asterism / Zenoh apps find the router when /home/asterism/config.toml
# does not name one (doc/ruby_asterism; FmrbAsterism.settings). Empty: the
# user sets it (Config, or this file).
zenoh_router = ""
debug_mode = false
# The remote debugger (start, kill and inspect apps over TCP 5565, with no
# authentication). Off here; when turned on, this build listens on
# 127.0.0.1 only -- reach it from another machine through an ssh forward.
debugd = false
mouse_scale_x = 0.5
mouse_scale_y = 0.5
# Rows one notch of the mouse wheel scrolls (1-20).
wheel_lines = 3
timezone = "JST-9"
keyboard_layout = "jp" # "jp" or "us"
# Internal RAM (KB) a spawn must leave for the rest of the machine; a start
# that would eat into this is refused with "Not enough memory". 30 is the
# floor that keeps drivers and networking able to allocate. 0 disables the
# floor (experiments only). Ignored by the Linux/wasm builds (host heap).
# CAUTION: too large locks out EVERY app - the editor and shell included -
# and the device then has no way to edit this file back (verified on a
# Tab5 at 200: free internal was ~127 KB, so nothing could start). Recovery
# is a reflash. Raise it in small steps.
# This is weighed against the free TOTAL only. A start is refused separately
# when no single free block holds the task stack; lowering this does not help
# that one (doc/reference/internal_ram_budget.md).
app_spawn_margin_kb = 30
language = "en" # "ja" or "en"

# The keyboard-only desktop (machines with desktop.variant = "keys",
# doc/linux_native): the key that opens the list of running apps --
# modifiers and one key, "ctrl+tab", "alt+s", "ctrl+shift+f1" -- and how long
# Esc is held (ms) to close the app in front, or, on the desktop itself, to
# end the program on a machine with exit_key = "esc_long". A shorter press is
# the app's own Esc.
keys_switcher_key = "ctrl+tab"
keys_esc_long_ms = 1000

# The logo and the jingle at power-on. false skips both and saves about 2.7
# seconds -- for a machine that exists to run one thing, the ceremony is not
# wanted every time. Nothing else changes: the cursor, the status LED and
# startup_app below all happen either way.
boot_splash = true

# Sound output. audio_mute silences the whole machine (apps, games, BASIC,
# the boot jingle) while everything keeps playing, like a speaker's mute
# switch; external MIDI output is not affected. audio_volume is a step,
# 0 (silence) to 10: step n plays at audio_level_min + (max - min) * n / 10
# dB, so with the default range each step is 5 dB (7 = -15 dB, 10 = 0 dB).
# Both are changed from the desktop (the speaker cell in the menu bar, the
# menu, Config) or remotely, and the machine writes these two lines itself,
# so they survive a reboot.
audio_mute = false
audio_volume = 7
# The level range in dB. 0 dB is the loudest the output plays without
# boosting the sound; uncomment to move either end.
# audio_level_min = -50.0
# audio_level_max = 0.0

# One app to open as soon as the desktop is up, by path (the same path the
# launcher uses, e.g. "/app/game/blockgame.app.rb"). Empty means none, which is
# the ordinary desktop. The browser sets this from ?app= in its URL.
startup_app = ""

# What the machine runs at boot. "desktop" is the ordinary desktop, launcher
# and windows; "app" runs startup_app alone, full screen, with no desktop --
# for a machine that exists to run one thing. With "app", an app that dies is
# started again startup_app_retries times (0 = never); after that the machine
# stops and shows why, on the screen and the serial log.
boot_mode = "desktop"
startup_app_retries = 3

# Desktop wallpaper. Empty means "whatever the theme says" -- the western
# picture, or the neon one under the cyberpunk theme, at the size of the
# screen. A path here wins over that; "none" leaves the desktop a plain
# colour. Any .png in /home/backgrounds shows up in Config's list.
wallpaper = ""

[theme]
desktop_bg = 0xF6
menu_bg = 0xC5
window_bg = 0xFF
text = 0x00
text_light = 0xFF
highlight = 0xEE
border = 0x60
button = 0x60
dir_color = 0x03

[[shortcuts]]
key = "l"
app = "launcher"

[[shortcuts]]
key = "s"
app = "default/shell"

[[shortcuts]]
key = "e"
app = "default/editor"

[[shortcuts]]
key = "n"
app = "app/tool/nsf_player.app.rb"

[[shortcuts]]
key = "i"
app = "default/inspector"


# App categories hidden from the launcher (files stay on flash and remain
# runnable from the editor, the file selector and debugd). Same list as the
# device configs, so this build shows what a machine shows.
[[launcher_exclude]]
dir = "debug"

[[launcher_exclude]]
dir = "test"

# The counterpart of the Retro configs' "modern" exclusion: apps that need
# hardware only a Retro machine has (NTSC output, the WROVER side) go under
# /app/retro. The directory does not exist yet -- an exclusion for a missing
# directory simply never matches.
[[launcher_exclude]]
dir = "retro"
