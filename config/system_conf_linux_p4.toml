# Linux simulation config for a Modern (ESP32-P4) target.
#
# Selected by the Rakefile when FMRB_HW_TARGET is a P4 board (TAB5 / NARYAv4),
# so the sim runs at the same framebuffer size as the real Modern hardware and
# its UI can be checked here. Everything else matches system_conf_linux.toml --
# this is still the SDL2 simulation, not the Tab5 panel.
#
# Note: graphics-audio remembers the framebuffer size in
# flash/etc/display_conf_linux.txt and applies a changed size on the NEXT boot,
# so the first run after switching targets still comes up at the old size.
system_name = "Family mruby OS (Modern sim)"
display_width = 426
display_height = 240
display_margin_x = 0
display_margin_y = 0
default_user_app_width = 386
default_user_app_height = 180
display_mode = "sdl2" # SDL2 window, Linux simulation (ntsc_ipc / spi_direct / headless / tab5_dsi / sdl2 / atom_display)
debug_mode = true
mouse_scale_x = 0.5
mouse_scale_y = 0.5
# Rows one notch of the mouse wheel scrolls (1-20).
wheel_lines = 3
timezone = "JST-9"
keyboard_layout = "jp" # "jp" or "us"
language = "en" # "ja" or "en"

# Desktop wallpaper. Empty means "whatever the theme says" -- the western
# picture, or the neon one under the cyberpunk theme, at the size of the
# screen. A path here wins over that; "none" leaves the desktop a plain
# colour. Any .png in /home shows up in Config's list.
wallpaper = ""

[theme]
desktop_bg = 0xF6
menu_bg = 0xC5
window_bg = 0xFF
text = 0x00
text_light = 0xFF
highlight = 0xEE
border = 0x60
button = 0x60
dir_color = 0x03

[[shortcuts]]
key = "l"
app = "launcher"

[[shortcuts]]
key = "s"
app = "default/shell"

[[shortcuts]]
key = "e"
app = "default/editor"

[[shortcuts]]
key = "n"
app = "app/tool/nsf_player.app.rb"

[[shortcuts]]
key = "i"
app = "default/inspector"


# App categories hidden from the launcher (files stay on flash and remain
# runnable from the editor, the file selector and debugd). Same list as the
# device configs, so the simulation shows what a machine shows -- a demo or a
# screenshot taken here is then the real thing.
[[launcher_exclude]]
dir = "debug"

[[launcher_exclude]]
dir = "test"

# The counterpart of the Retro configs' "modern" exclusion: apps that need
# hardware only a Retro machine has (NTSC output, the WROVER side) go under
# /app/retro. The directory does not exist yet -- an exclusion for a missing
# directory simply never matches.
[[launcher_exclude]]
dir = "retro"
