system_name = "Family mruby OS"
display_width = 320
display_height = 240
default_user_app_width = 320
default_user_app_height = 240
display_mode = "atom_display" # M5Stack ATOM Display, HDMI (ntsc_ipc / spi_direct / headless / tab5_dsi / sdl2 / atom_display)
debug_mode = true
ble_auto_start = true # false = keep BLE off at boot (saves ~75KB internal RAM); start it from the desktop menu
mouse_scale_x = 1.0
mouse_scale_y = 1.0
timezone = "JST-9"
keyboard_layout = "jp" # "jp" or "us"
language = "en" # "ja" or "en"

[theme]
desktop_bg = 0xF6
menu_bg = 0xC5
window_bg = 0xFF
text = 0x00
text_light = 0xFF
highlight = 0xEE
border = 0x60
button = 0x60
dir_color = 0x03
