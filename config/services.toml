# System services (/etc/services.toml).
#
# Shipped with the firmware and copied into the flash image by the build, so
# this file -- not flash/etc/services.toml -- is the one to edit. Bodies live
# in /usr/share/services/.
#
# The user's own list is /home/services.toml. It is read after this one and
# wins field by field, so a user can retune a system service or switch one off
# with "enable = false" without touching the firmware.
#
# Fields:
#   file         source under /usr/share/services/
#   class        the class inside it
#   enable       false keeps the entry but does not run it (default true)
#   interval_ms  how often on_tick is called; omit for a service that only
#                reacts to topics (a one-off callback is ctx.wake_in ->
#                on_wake, which does not need one either)
#   oneshot      true = on_start once at boot, then out of the list
#   [<name>.config]  handed to the service as ctx.config

[clock]
file = "clock.rb"
class = "ClockService"
enable = true
interval_ms = 60000

# Watches the network and publishes net/state. The IP goes in the log the
# moment there is one, which is the answer to having to look it up.
[net]
file = "net.rb"
class = "NetWatch"
enable = true
interval_ms = 5000

# Sets the clock from an NTP server once the machine is on the network, so
# Set Clock stops being a chore after every power cut. The tick is the coarse
# re-sync timer; the first sync happens on the net/state event.
[timesync]
file = "timesync.rb"
class = "TimeSync"
enable = true
interval_ms = 86400000

[timesync.config]
server = "pool.ntp.org"
interval_hours = 24

# Says things out loud. Anything (a service, an app) that publishes to
# "tts/say" gets read aloud; a sentence said once is cached as a WAV in
# /home/voice/cache and plays from there afterwards, network or no network.
#
# The cache key is server + speaker + text, so the same sentence in another
# voice is a different file. That has one consequence worth knowing: to run
# offline, LEAVE the server line where it is and simply let it be unreachable
# -- a miss then costs one refused connection and a log line, and everything
# already said still plays. Deleting the line instead changes the key, and the
# machine stops finding its own cache.
#
#   [tts.config]
#   server = "http://192.168.10.5:50021"
#   speaker = 1
#   timeout_ms = 3000
[tts]
file = "tts.rb"
class = "TtsService"
enable = true
