system_name = "Family mruby OS"
display_width = 320
display_height = 240
display_margin_x = 2
display_margin_y = 16
default_user_app_width = 280
default_user_app_height = 180
display_mode = "ntsc_ipc" # NTSC via the WROVER graphics MCU (ntsc_ipc / spi_direct / headless / tab5_dsi / sdl2 / atom_display)
debug_mode = true
# Retro: one radio on the S3, so false really does keep the radio down --
# BLE never starts, and WiFi can have the radio instead. Start BLE later
# from the desktop menu when you need the console. (On Modern the same key
# only withholds the BLE service; see config/system_conf_p4.toml.)
ble_auto_start = true # false = keep BLE off at boot; saves ~75KB internal RAM
wifi_auto_start = false # needs ssid/password in wifi.toml; on S3 BLE must be off (one radio at a time)
mouse_scale_x = 0.5
mouse_scale_y = 0.5
timezone = "JST-9"
keyboard_layout = "jp" # "jp" or "us"
language = "en" # "ja" or "en"

[theme]
desktop_bg = 0xF6
menu_bg = 0xC5
window_bg = 0xFF
text = 0x00
text_light = 0xFF
highlight = 0xEE
border = 0x60
button = 0x60
dir_color = 0x03

[[shortcuts]]
key = "l"
app = "launcher"

[[shortcuts]]
key = "s"
app = "default/shell"

[[shortcuts]]
key = "e"
app = "default/editor"

[[shortcuts]]
key = "n"
app = "app/tool/nsf_player.app.rb"

[[shortcuts]]
key = "i"
app = "default/inspector"

# Desktop wallpaper: the WROVER draws it from its /data, so the kernel must
# push it across. Linux sim has the same entry; this one was missing when the
# asset moved out of /data, which blanked the wallpaper on the real board.
[[sync_files]]
src = "/usr/share/backgrounds/bg_426x240.png"
dest = "/flash/data/bg_426x240.png"

# App categories hidden from the launcher (files stay on flash and remain
# runnable via the editor / debugd). The Linux sim config has no entries,
# so the sim still shows everything.
[[launcher_exclude]]
dir = "debug"

[[launcher_exclude]]
dir = "test"

# Apps that need hardware only a Modern (ESP32-P4 / Tab5) machine has -- the
# microphone and the six-axis sensor. They run anywhere (each one checks for
# its device and falls back), but there is nothing for them to read on this
# board, so keep them out of the launcher. The Modern config excludes
# "retro" in the same way; that directory does not exist yet.
[[launcher_exclude]]
dir = "modern"
