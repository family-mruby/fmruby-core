system_name = "Family mruby OS"
display_width = 320
display_height = 240
display_margin_x = 0
display_margin_y = 0
default_user_app_width = 280
default_user_app_height = 180
display_mode = "sdl2" # SDL2 window, Linux simulation (ntsc_ipc / spi_direct / headless / tab5_dsi / sdl2 / atom_display)
debug_mode = true
mouse_scale_x = 0.5
mouse_scale_y = 0.5
timezone = "JST-9"
keyboard_layout = "jp" # "jp" or "us"
language = "en" # "ja" or "en"

[theme]
desktop_bg = 0xF6
menu_bg = 0xC5
window_bg = 0xFF
text = 0x00
text_light = 0xFF
highlight = 0xEE
border = 0x60
button = 0x60
dir_color = 0x03

[[shortcuts]]
key = "l"
app = "launcher"

[[shortcuts]]
key = "s"
app = "default/shell"

[[shortcuts]]
key = "e"
app = "default/editor"

[[shortcuts]]
key = "n"
app = "app/tool/nsf_player.app.rb"

[[shortcuts]]
key = "i"
app = "default/inspector"

[[sync_files]]
src = "/usr/share/sounds/test.nsf"
dest = "/flash/data/test.nsf"

# Desktop wallpaper: on Linux the GA process loads images from its own
# flash/, so transfer it from the Core side at boot (Modern reads it locally).
[[sync_files]]
src = "/data/bg_426x240.png"
dest = "/flash/data/bg_426x240.png"
