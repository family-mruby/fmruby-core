# Settings for the WebAssembly (browser) build -- doc/wasm/.
#
# The web bundle stages ONLY git-tracked flash/ content plus this file, so
# nothing personal or secret can reach it. Based on system_conf_p4.toml: the
# wasm build reuses the Modern in-process display path (display_mode is not
# consulted on wasm; the value stays for the shared parser). No radios, no
# remote desktop.
system_name = "Family mruby OS (Web)"
display_width = 426
display_height = 240
# No overscan margin: the Tab5 LCD shows the full framebuffer, unlike
# the NTSC output where the border area is hidden by overscan.
display_margin_x = 0
display_margin_y = 0
default_user_app_width = 386
default_user_app_height = 180
display_mode = "tab5_dsi" # Tab5 MIPI-DSI panel, driven locally (ntsc_ipc / spi_direct / headless / tab5_dsi / sdl2 / atom_display)
# How many app slots to hand out. The device targets leave this out and get
# their build ceiling of 9; the web build raises the ceiling to 32
# (wasm/CMakeLists.txt) because browser memory is not the device's, and says so
# here. Anything above the ceiling is clamped with a warning at boot.
max_apps = 32
debug_mode = true
# No radios on the web build: BLE / WiFi settings are not present here.
mouse_scale_x = 0.5
mouse_scale_y = 0.5
# Rows one notch of the mouse wheel scrolls (1-20).
wheel_lines = 3
timezone = "JST-9"
keyboard_layout = "jp" # "jp" or "us"
# Internal RAM (KB) a spawn must leave for the rest of the machine; a start
# that would eat into this is refused with "Not enough memory". 30 is the
# floor that keeps drivers and networking able to allocate. 0 disables the
# floor (experiments only). Ignored by the Linux/wasm builds (host heap).
# CAUTION: too large locks out EVERY app - the editor and shell included -
# and the device then has no way to edit this file back (verified on a
# Tab5 at 200: free internal was ~127 KB, so nothing could start). Recovery
# is a reflash. Raise it in small steps.
# This is weighed against the free TOTAL only. A start is refused separately
# when no single free block holds the task stack; lowering this does not help
# that one (doc/reference/internal_ram_budget.md).
app_spawn_margin_kb = 30
language = "en" # "ja" or "en"

# The logo and the jingle at power-on. false skips both and saves about 2.7
# seconds -- for a machine that exists to run one thing, the ceremony is not
# wanted every time. Nothing else changes: the cursor, the status LED and
# startup_app below all happen either way.
boot_splash = true

# Sound output. audio_mute silences the whole machine (apps, games, BASIC,
# the boot jingle) while everything keeps playing, like a speaker's mute
# switch; external MIDI output is not affected. audio_volume is a step,
# 0 (silence) to 10: step n plays at audio_level_min + (max - min) * n / 10
# dB, so with the default range each step is 5 dB (7 = -15 dB, 10 = 0 dB).
# Both are changed from the desktop (the speaker cell in the menu bar, the
# menu, Config) or remotely, and the machine writes these two lines itself,
# so they survive a reboot.
audio_mute = false
audio_volume = 7
# The level range in dB. 0 dB is the loudest the output plays without
# boosting the sound; uncomment to move either end.
# audio_level_min = -50.0
# audio_level_max = 0.0

# One app to open as soon as the desktop is up, by path (the same path the
# launcher uses, e.g. "/app/game/blockgame.app.rb"). Empty means none, which is
# the ordinary desktop. The browser sets this from ?app= in its URL.
startup_app = ""

# What the machine runs at boot. "desktop" is the ordinary desktop, launcher
# and windows; "app" runs startup_app alone, full screen, with no desktop --
# for a machine that exists to run one thing. With "app", an app that dies is
# started again startup_app_retries times (0 = never); after that the machine
# stops and shows why, on the screen and the serial log.
boot_mode = "desktop"
startup_app_retries = 3

# Where Asterism / Zenoh apps find the router (doc/ruby_asterism, B1, B2). A
# page cannot open TCP, so the browser reaches zenohd over WebSocket: its ws/
# listener (the parent repository's docker-compose.zenoh-ws.yml). The page's
# Network panel sets this for good; ?zenoh= in the page's URL replaces it for
# one visit (?zenoh=ws/192.0.2.10:7449). A page served over https uses wss://
# for any host but a loopback one (the locator stays ws/). The test apps read
# it when /home/zenoh_echo.txt does not name a router.
zenoh_router = "ws/localhost:7449"

# This browser's Asterism node ID (doc/ruby_asterism, B2). Empty here: the page
# makes one on its first visit (wasm-<6 hex digits>), keeps it in the browser
# and hands it in at every boot. The test apps use it when
# /home/asterism_node.txt does not name the node.
asterism_node = ""

# Desktop wallpaper. Empty means "whatever the theme says" -- the western
# picture, or the neon one under the cyberpunk theme, at the size of the
# screen. A path here wins over that; "none" leaves the desktop a plain
# colour. Any .png in /home/backgrounds shows up in Config's list.
wallpaper = ""

# Web default: the cyberpunk palette (RGB332). 0x01 is OFF-LIMITS for any
# theme color: it is the desktop foreground canvas color key (transparent).
# Config, inside the machine, is the only place these change; what it saves
# is handed back at the next boot (page_settings_wasm.c). The page had a
# theme selector of its own until 2026-09-03 -- doc/wasm/report/
# page_theme_removed.md says why it does not.
[theme]
desktop_bg = 0x00
menu_bg = 0x22
window_bg = 0x00
text = 0x1C
text_light = 0xFF
highlight = 0xE3
border = 0x0E
button = 0x46
dir_color = 0xFC

[[shortcuts]]
key = "l"
app = "launcher"

[[shortcuts]]
key = "s"
app = "default/shell"

[[shortcuts]]
key = "e"
app = "default/editor"

[[shortcuts]]
key = "n"
app = "app/tool/nsf_player.app.rb"

[[shortcuts]]
key = "i"
app = "default/inspector"

# App categories hidden from the launcher (files stay on flash and remain
# runnable via the editor / debugd). The Linux sim config has no entries,
# so the sim still shows everything.
[[launcher_exclude]]
dir = "debug"

[[launcher_exclude]]
dir = "test"

# The counterpart of the Retro configs' "modern" exclusion: apps that need
# hardware only a Retro machine has (NTSC output, the WROVER side) go under
# /app/retro and are hidden here. The directory does not exist yet -- an
# exclusion for a missing directory simply never matches. /app/modern stays
# visible on this board; that is what it is for.
[[launcher_exclude]]
dir = "retro"

# Remote desktop (browser viewer via WiFi). WiFi credentials live in
# /etc/wifi.toml (see config/wifi_p4.toml.example).
