system_name = "Family mruby OS (Modern)"
display_width = 426
display_height = 240
# No overscan margin: the Tab5 LCD shows the full framebuffer, unlike
# the NTSC output where the border area is hidden by overscan.
display_margin_x = 0
display_margin_y = 0
default_user_app_width = 386
default_user_app_height = 180
display_mode = "tab5_dsi" # Tab5 MIPI-DSI panel, driven locally (ntsc_ipc / spi_direct / headless / tab5_dsi / sdl2 / atom_display)
debug_mode = true
# ble_auto_start means something different here than it does on Retro, because
# the radio is on the C6 rather than on this chip:
#   Modern (here) false = no BLE service. Nothing is advertised and nothing can
#                        connect, but the C6 SDIO link is still raised when
#                        wifi_auto_start is on -- only NimBLE's transport init
#                        can raise it, and WiFi aborts without it (measured).
#                        Frees ~16KB of internal RAM, not the ~75KB Retro frees.
#                        To take the radio down as well, set wifi_auto_start
#                        false too: then the C6 is left down entirely.
#   Retro          false = BLE never starts at all (one radio on the S3), and it
#                        can be started later from the desktop menu.
# Either way the change needs a reboot.
ble_auto_start = true
wifi_auto_start = true  # P4: C6 runs BLE + WiFi together; needs ssid/password in wifi.toml
mouse_scale_x = 0.5
mouse_scale_y = 0.5
timezone = "JST-9"
keyboard_layout = "jp" # "jp" or "us"
language = "en" # "ja" or "en"

[theme]
desktop_bg = 0xF6
menu_bg = 0xC5
window_bg = 0xFF
text = 0x00
text_light = 0xFF
highlight = 0xEE
border = 0x60
button = 0x60
dir_color = 0x03

[[shortcuts]]
key = "l"
app = "launcher"

[[shortcuts]]
key = "s"
app = "default/shell"

[[shortcuts]]
key = "e"
app = "default/editor"

[[shortcuts]]
key = "n"
app = "app/tool/nsf_player.app.rb"

[[shortcuts]]
key = "i"
app = "default/inspector"

[[sync_files]]
src = "/usr/share/sounds/nsf/test.nsf"
dest = "/flash/data/test.nsf"

# App categories hidden from the launcher (files stay on flash and remain
# runnable via the editor / debugd). The Linux sim config has no entries,
# so the sim still shows everything.
[[launcher_exclude]]
dir = "debug"

[[launcher_exclude]]
dir = "test"

# Remote desktop (browser viewer via WiFi). WiFi credentials live in
# /etc/wifi.toml (see config/wifi_p4.toml.example).
[remote_desktop]
enable = true
mode = "h264"              # "h264" (WebCodecs viewer) | "mjpeg" only
fps_cap = 15
jpeg_quality = 80
h264_bitrate_kbps = 1000
h264_gop = 30
