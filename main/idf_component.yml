dependencies:
  espressif/usb_host_hid:
    version: "^1.0.0"
    rules:
      - if: "idf_version >= 5.0"
      - if: "target != linux"
  m5stack/m5gfx:
    version: "*"
    rules:
      - if: "target != linux"
  m5stack/m5unified:
    version: "*"
    rules:
      - if: "target != linux"
  # ES8388 codec control for Tab5 speaker output (Modern/P4 only)
  espressif/esp_codec_dev:
    version: "^1.3.0"
    rules:
      - if: "target == esp32p4"
  # BLE via the ESP32-C6 coprocessor over SDIO (Modern/P4 only).
  # Versions pinned to match the stock Tab5 C6 slave firmware (V1.4.1)
  # and the M5Tab5-UserDemo reference configuration.
  espressif/esp_hosted:
    version: "1.4.0"
    rules:
      - if: "target == esp32p4"
  espressif/esp_wifi_remote:
    version: "0.8.5"
    rules:
      - if: "target == esp32p4"
  # Remote desktop (Modern/P4 only): mDNS so the browser can reach the
  # device as http://<hostname>.local/ without knowing the DHCP address
  espressif/mdns:
    version: "^1.8.0"
    rules:
      - if: "target == esp32p4"
  # Remote desktop Phase 2: P4 hardware H.264 encoder
  espressif/esp_h264:
    version: "^1.1.0"
    rules:
      - if: "target == esp32p4"
