dependencies:
  espressif/usb_host_hid:
    version: "^1.0.0"
    rules:
      - if: "idf_version >= 5.0"
      - if: "target != linux"
  m5stack/m5gfx:
    version: "*"
    rules:
      - if: "target != linux"
  m5stack/m5unified:
    version: "*"
    rules:
      - if: "target != linux"
  # ES8388 codec control for Tab5 speaker output (Modern/P4 only)
  espressif/esp_codec_dev:
    version: "^1.3.0"
    rules:
      - if: "target == esp32p4"
