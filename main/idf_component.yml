dependencies:
  espressif/usb_host_hid:
    version: "^1.0.0"
    rules:
      - if: "idf_version >= 5.0"
      - if: "target != linux"
  m5stack/m5gfx:
    version: "*"
    rules:
      - if: "target != linux"
  m5stack/m5unified:
    version: "*"
    rules:
      - if: "target != linux"
  # ES8388 codec control for Tab5 speaker output (Modern/P4 only)
  espressif/esp_codec_dev:
    version: "^1.3.0"
    rules:
      - if: "target == esp32p4"
  # BLE via the ESP32-C6 coprocessor over SDIO (Modern/P4 only).
  # Versions pinned to match the stock Tab5 C6 slave firmware (V1.4.1)
  # and the M5Tab5-UserDemo reference configuration.
  espressif/esp_hosted:
    version: "1.4.0"
    rules:
      - if: "target == esp32p4"
  espressif/esp_wifi_remote:
    version: "0.8.5"
    rules:
      - if: "target == esp32p4"
  # mDNS so other machines can reach the device as <hostname>.local without
  # knowing the DHCP address. P4 (remote desktop) and S3 (native WiFi STA);
  # unused on ATOM (WiFi disabled in its sdkconfig) and dropped by the linker.
  espressif/mdns:
    version: "^1.8.0"
    rules:
      - if: "target in [esp32p4, esp32s3]"
  # LT8912B MIPI-DSI -> HDMI bridge. NARYA v4 puts its picture on an HDMI
  # monitor through this chip; the Tab5 (same target) has a DSI panel and
  # never references the driver, so the linker drops it there.
  espressif/esp_lcd_lt8912b:
    version: "^0.2.0"
    rules:
      - if: "target == esp32p4"
  # Remote desktop Phase 2: P4 hardware H.264 encoder
  espressif/esp_h264:
    version: "^1.1.0"
    rules:
      - if: "target == esp32p4"
  # esp-dsp: the fourth engine of the FFT comparison (doc/mic_spectrum), and
  # the transform the microphone visualiser will run. Espressif's hand-written
  # assembler radix-2 is the ceiling the other three are measured against, so
  # it is only on the targets where that measurement means something -- the
  # Linux build compares C, Spinel and mruby alone (fmrb_fft_bench.c guards on
  # __has_include, so it also builds if this dependency is ever absent).
  espressif/esp-dsp:
    version: "^1.6.0"
    rules:
      - if: "target in [esp32p4, esp32s3]"
