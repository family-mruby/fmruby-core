<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family mruby Console</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="container">
  <header>
    <h1>Family mruby Console</h1>
    <span class="status" id="storageInfo"></span>
    <span class="status" id="statusBadge">Disconnected</span>
  </header>

  <div class="toolbar">
    <button id="btnConnect" class="primary" onclick="toggleConnection()">Connect</button>
    <button id="btnRefresh" disabled onclick="refreshDir()">Refresh</button>
    <button id="btnMkdir" disabled onclick="createDir()">New Folder</button>
    <button id="btnNewFile" disabled onclick="createFile()">New File</button>
  </div>

  <div class="tabs">
    <button id="tabFiles" class="active" onclick="switchTab('files')">Files</button>
    <button id="tabLogs" onclick="switchTab('logs')">Logs</button>
  </div>

  <div id="filesPane" class="pane active">
    <div class="breadcrumb" id="breadcrumb"></div>

    <div class="file-list" id="fileList">
      <div class="empty-msg">Connect to a Family-mruby device to browse files.</div>
    </div>

    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" multiple onchange="uploadFiles(this.files)">
      Drop files here or click to upload
    </div>

    <div class="progress" id="progress">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText"></div>
    </div>
  </div>

  <div id="logsPane" class="pane">
    <div class="devlog-toolbar">
      <button id="btnLogSubscribe" class="primary" disabled onclick="toggleLogSubscribe()">Subscribe</button>
      <label>Level
        <select id="logLevelSelect" onchange="onLogLevelChange()">
          <option value="E">E (Error)</option>
          <option value="W">W (Warn)</option>
          <option value="I" selected>I (Info)</option>
          <option value="D">D (Debug)</option>
        </select>
      </label>
      <label>Filter
        <input type="text" id="logFilterInput" placeholder="substring" oninput="applyLogFilter()">
      </label>
      <label><input type="checkbox" id="logAutoScroll" checked> Auto-scroll</label>
      <button onclick="clearDeviceLog()">Clear</button>
      <span class="devlog-status" id="logStatus">idle</span>
    </div>
    <div class="devlog-box" id="deviceLogBox"></div>
  </div>

  <div class="log-area">
    <details>
      <summary>Log</summary>
      <div class="log-box" id="logBox"></div>
    </details>
  </div>
</div>

<div class="editor-modal" id="editorModal">
  <div class="editor-card">
    <div class="editor-header">
      <span class="path" id="editorPath"></span>
      <span class="dirty" id="editorDirty"></span>
      <button class="primary" onclick="saveEditor()">Save</button>
      <button onclick="closeEditor()">Close</button>
    </div>
    <div class="editor-area">
      <div class="editor-stack">
        <pre class="editor-highlight" aria-hidden="true"><code id="editorHighlight" class="language-none"></code></pre>
        <textarea id="editorTextarea" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
      </div>
    </div>
    <div class="editor-footer">
      <span class="stats" id="editorStats"></span>
      <span id="editorMessage"></span>
    </div>
  </div>
</div>

<script src="vendor/prism.js"></script>
<script src="js/app.js"></script>
</body>
</html>
