app_screen_name = "App Store"
app_screen_name_ja = "アプリの店"
icon = "usr/share/icon/appstore.icon"
default_window_mode = "window"
default_window_width = 280
default_window_height = 190
default_window_pos_x = 14
default_window_pos_y = 26
min_window_width = 240
min_window_height = 150
resizable = 1
# No task_stack_kb. That stack is internal RAM, the scarcest thing on a board,
# and the store holding 32 KB of it is 32 KB the app it just installed cannot
# have -- a NARYA v4 refused a second 32 KB app outright. The list is read as
# lines now rather than parsed as JSON, which is what made the deep stack look
# necessary in the first place.
