app_handle_name = "picorabbit"
app_screen_name = "PicoRabbit+"
app_screen_name_ja = "ピコラビット＋"
default_window_mode = "fullscreen"
fullscreen_any_size = true   # lays itself out at any size: no 426x240 screen on a 640x360 one
icon = "usr/share/icon/ruby.icon"
large_memory = 1
# fmrb_code slide blocks are eval-compiled (mruby codegen recursion on the
# task C stack); 16KB overflowed on P4. See fmrb_task_config.h.
task_stack_kb = 24
# Ctrl+Tab may park the presentation (task frozen, canvases hidden by the
# C-level suspend; state and pixels are preserved until unpark)
fullscreen_switchable = 1
