# script name must be "app_handle_name.app.bas"
app_handle_name = "sample_basic_app"
app_screen_name = "BASIC app demo"
app_screen_name_ja = "BASICデモ"
# A .bas app defaults to fullscreen: the Family BASIC screen is a fixed
# 28x24 character plane (224x192 px). Set "window" here to run it inside a
# desktop window instead.
#default_window_mode = "window" # or "fullwindow" or "window" or "background"

# if fullscreen/fullwindow, they will be ignored
default_window_width = 200
default_window_height = 150

# if fullscreen/fullwindow, they will be ignored
default_window_pos_x = 10
default_window_pos_y = 15
