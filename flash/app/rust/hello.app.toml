# The app of docs/getting_started.md (rust/examples/hello). Put it next
# to hello.app.wasm, both in a directory under /app (the directory is the
# launcher's category).
app_screen_name = "Rust hello"
language = "rust"
icon = "usr/share/icon/rust.icon"
default_window_mode = "window"
default_window_width = 160
default_window_height = 70
default_window_pos_x = 60
default_window_pos_y = 50
# Not listed in the launcher (the guide starts it by path); the tour and
# the other examples are.
launcher_visible = false
