app_handle_name = "mahjong"
app_screen_name = "Hide Jong"
app_screen_name_ja = "ヒデ雀"
default_window_mode = "fullscreen"
# 640x360 on Modern and the browser build while it is on top.
fullscreen_hires = true
single_instance = true
# The LARGE pool (2x the ordinary one). Compiling the 57 KB main file peaks
# at 94% of the ordinary pool on Modern (986 KB of 1 MB); after that compile
# the pool is in pieces and the required files no longer fit
# (doc/reference/app_memory.md).
large_memory = 1
icon = "app/game/mahjong/mahjong.icon"
# The table compiles some of its files only when they are first needed
# (mahjong_640, mahjong_xl, mahjong_watch, ...: `require` from inside the
# game's own calls). On the default 16 KB the compiler's recursion overflowed
# the task stack when a game started on a Tab5 (Stack protection fault in
# codegen, 2026-11-22). 32 KB was the first value that worked there; 24 KB is
# the value to keep if it holds on the boards (not measured yet: open every
# layout -- the table, 640, watching, replay, stats -- and read the task's
# stack high-water mark). Internal RAM, one instance.
task_stack_kb = 24
