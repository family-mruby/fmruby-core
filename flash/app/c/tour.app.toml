# The SDK's tour example (c/examples/tour; docs/tour.md is the common
# specification every language's tour follows). c/build.rb writes this
# next to tour.app.wasm with sdk_version set.
app_screen_name = "C tour"
language = "c"
default_window_mode = "window"
default_window_width = 230
default_window_height = 175
default_window_pos_x = 45
default_window_pos_y = 30
sdk_version = "0.1.0"
