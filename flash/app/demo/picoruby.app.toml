app_handle_name = "picoruby"
app_screen_name = "PicoRuby demo"
app_screen_name_ja = "PicoRubyデモ"

default_window_mode = "window"

# The tour is a big single file; the compiler needs the roomier arena on the
# device (it runs out on ESP32-P4 without this).
large_memory = 1

default_window_width = 300
default_window_height = 214

default_window_pos_x = 10
default_window_pos_y = 20
