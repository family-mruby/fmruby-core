# The default set of desktop icons, top to bottom (doc/desktop_icons/).
#
# Used while /home/desktop.toml does not exist. The launcher's icon menu
# writes that file, and from then on it decides; delete it to come back here.
# An entry whose app is not on the machine is skipped, so one list serves
# every board (a board whose storage leaves an app out just shows one less).
# "desktop/launcher" and "desktop/file_manager" are not apps: they open the
# launcher (the menu's Launcher) and the File Manager.
# "linux:<id>" is a Linux PC's application by its desktop file id, shown
# only where it is installed (the Linux PC session; nothing elsewhere);
# "linux:a|b" shows the first of a and b installed (a .deb and a snap).
apps = [
  "desktop/launcher",
  "default/editor",
  "default/shell",
  "desktop/file_manager",
  "/app/game/flappy.app.rb",
  "/app/basic/basic.app.bas",
  "/app/game/breakout/breakout.app.py",
  "/app/tool/nsf_player.app.rb",
  "linux:org.kde.konsole",
  "linux:firefox|firefox_firefox|org.mozilla.firefox",
  "linux:google-chrome|com.google.Chrome",
]
