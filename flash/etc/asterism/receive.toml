# Who may send files and apps to this machine over Asterism
# (doc/asterism_file_transfer). This is the copy the system ships; the
# machine's own is /home/asterism/receive.toml, made from this one the first
# time it is changed (the Receiving app, or the shell's areceive), and read
# instead of this one from then on.
#
# enabled: receive at all. Off (or no line), nothing is taken, whatever the
# lists say, and the transfer app is not started at boot.
enabled = false

# send_enabled: keep this machine on the network for sending, so that the
# window menu's Send to lists the machines at once. Off (or no line), Send to
# is greyed; the shell's amove and asend still send, connecting when asked.
# Either switch on starts the transfer app at boot.
send_enabled = false

# Who may put files in /home/inbox: node IDs and patterns ("fmruby-*";
# "*" is everyone on the network: the owner's trusted members).
[file]
from = []

# Who may move apps here (checkpoint). "*" lets everyone on the network
# (the owner's trusted members) move apps to this machine.
[checkpoint]
from = []
