# xdg-desktop-portal-wlr in the Family mruby session (installed as
# /etc/xdg/xdg-desktop-portal-wlr/family-mruby, read only when
# XDG_CURRENT_DESKTOP is family-mruby; doc/linux_native L14).
#
# Family mruby shows one output, so a share takes it without asking which
# (no chooser program -- slurp, wofi -- is needed). The program asking to
# share (a browser) asks the user first.
[screencast]
chooser_type=none
