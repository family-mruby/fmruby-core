# The desktop portal's backends in the Family mruby session (installed as
# /usr/share/xdg-desktop-portal/family-mruby-portals.conf; the session's
# XDG_CURRENT_DESKTOP is family-mruby, doc/linux_native L14).
#
# Sharing the screen (a browser's meeting) and recording it go to
# xdg-desktop-portal-wlr, which takes Family mruby's screen through the
# compositor's ext-image-copy-capture. Everything else (opening a file,
# the questions a screenshot asks first) goes to the desktop's own portal,
# Plasma's or GNOME's, whichever is installed.
[preferred]
default=kde;gtk;
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
