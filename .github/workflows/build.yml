name: Build Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-esp32:
    # Both hardware generations, because they do not share a build: Retro is
    # Xtensa (S3) and Modern is RISC-V (P4), and the two take different
    # branches through the drivers. A change that only breaks one of them used
    # to reach main unnoticed -- Modern was built only by the release workflow.
    name: build-esp32 (${{ matrix.hw_target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hw_target: [NARYAv3, TAB5]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix file permissions
        run: sudo chown -R $(id -u):$(id -g) .

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install Ruby dependencies
        run: gem install serialport

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract repository owner (lowercase)
        id: repo_owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Load version from .env
        id: version
        run: echo "ESP_IDF_VERSION=$(grep ESP_IDF_VERSION .env | cut -d '=' -f2)" >> $GITHUB_OUTPUT

      - name: Pull Docker image from GHCR
        run: docker pull ghcr.io/${{ steps.repo_owner.outputs.owner }}/fmruby-esp32-build:${{ steps.version.outputs.ESP_IDF_VERSION }}

      - name: Tag image for Rakefile
        run: docker tag ghcr.io/${{ steps.repo_owner.outputs.owner }}/fmruby-esp32-build:${{ steps.version.outputs.ESP_IDF_VERSION }} esp32_build_container:${{ steps.version.outputs.ESP_IDF_VERSION }}

      - name: Select HW target
        # The target comes from .env, which overrides the environment (a CLI
        # FMRB_HW_TARGET would be silently ignored), so edit the file itself
        # and verify exactly one active target remains.
        run: |
          sed -i 's/^FMRB_HW_TARGET=/#FMRB_HW_TARGET=/' .env
          sed -i 's/^#FMRB_HW_TARGET=${{ matrix.hw_target }}$/FMRB_HW_TARGET=${{ matrix.hw_target }}/' .env
          test "$(grep -c '^FMRB_HW_TARGET=' .env)" = 1
          grep '^FMRB_HW_TARGET=${{ matrix.hw_target }}$' .env

      - name: Build ESP32
        run: rake build:esp32

      # - name: Upload ESP32 artifacts
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: fmruby-core-esp32
      #     path: |
      #       build/fmruby-core.elf
      #       build/fmruby-core.bin
      #       build/bootloader/bootloader.bin
      #       build/partition_table/partition-table.bin
      #     retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix file permissions
        run: sudo chown -R $(id -u):$(id -g) .

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install Ruby dependencies
        run: gem install serialport

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract repository owner (lowercase)
        id: repo_owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Load version from .env
        id: version
        run: echo "ESP_IDF_VERSION=$(grep ESP_IDF_VERSION .env | cut -d '=' -f2)" >> $GITHUB_OUTPUT

      - name: Pull Docker image from GHCR
        run: docker pull ghcr.io/${{ steps.repo_owner.outputs.owner }}/fmruby-esp32-build:${{ steps.version.outputs.ESP_IDF_VERSION }}

      - name: Tag image for Rakefile
        run: docker tag ghcr.io/${{ steps.repo_owner.outputs.owner }}/fmruby-esp32-build:${{ steps.version.outputs.ESP_IDF_VERSION }} esp32_build_container:${{ steps.version.outputs.ESP_IDF_VERSION }}

      - name: Build Linux target
        run: rake build:linux

      # - name: Upload Linux artifacts
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: fmruby-core-linux
      #     path: build/fmruby-core.elf
      #     retention-days: 7

