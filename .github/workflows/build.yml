name: Build Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-esp32:
    # Both hardware generations, because they do not share a build: Retro is
    # Xtensa (S3) and Modern is RISC-V (P4), and the two take different
    # branches through the drivers. A change that only breaks one of them used
    # to reach main unnoticed -- Modern was built only by the release workflow.
    name: build-esp32 (${{ matrix.hw_target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hw_target: [NARYAv3, TAB5]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix file permissions
        run: sudo chown -R $(id -u):$(id -g) .

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install Ruby dependencies
        run: gem install serialport

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract repository owner (lowercase)
        id: repo_owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Load version from .env
        id: version
        run: echo "ESP_IDF_VERSION=$(grep ESP_IDF_VERSION .env | cut -d '=' -f2)" >> $GITHUB_OUTPUT

      - name: Pull Docker image from GHCR
        run: docker pull ghcr.io/${{ steps.repo_owner.outputs.owner }}/fmruby-esp32-build:${{ steps.version.outputs.ESP_IDF_VERSION }}

      - name: Tag image for Rakefile
        run: docker tag ghcr.io/${{ steps.repo_owner.outputs.owner }}/fmruby-esp32-build:${{ steps.version.outputs.ESP_IDF_VERSION }} esp32_build_container:${{ steps.version.outputs.ESP_IDF_VERSION }}

      - name: Select HW target
        # The target comes from .env, which overrides the environment (a CLI
        # FMRB_HW_TARGET would be silently ignored), so edit the file itself
        # and verify exactly one active target remains.
        run: |
          sed -i 's/^FMRB_HW_TARGET=/#FMRB_HW_TARGET=/' .env
          sed -i 's/^#FMRB_HW_TARGET=${{ matrix.hw_target }}$/FMRB_HW_TARGET=${{ matrix.hw_target }}/' .env
          test "$(grep -c '^FMRB_HW_TARGET=' .env)" = 1
          grep '^FMRB_HW_TARGET=${{ matrix.hw_target }}$' .env

      - name: Build ESP32
        run: rake build:esp32

      # - name: Upload ESP32 artifacts
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: fmruby-core-esp32
      #     path: |
      #       build/fmruby-core.elf
      #       build/fmruby-core.bin
      #       build/bootloader/bootloader.bin
      #       build/partition_table/partition-table.bin
      #     retention-days: 7

  test-host:
    # Native host test suites (rake test): picoruby-ti, BASIC golden, and the
    # MicroPython smoke build. These run with the runner's own gcc/g++/python3
    # -- no docker, no device -- so they are far cheaper than the builds above
    # and gate every push. The sim/integration tier (tools/dev_run_check.sh)
    # is not run here; it needs the docker Linux stack and a framebuffer.
    name: test-host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Recursive: the picoruby-ti host tests link against the prism copy
          # bundled in the picoruby submodule (rake ti:test).
          submodules: recursive
          fetch-depth: 0

      - name: Fix file permissions
        run: sudo chown -R $(id -u):$(id -g) .

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install Ruby dependencies
        # rbs: tidbgen parses sig/*.rbs to build the picoruby-ti type database
        # (rake ti:gen / ti:test). serialport keeps the Rakefile load clean.
        run: gem install rbs serialport

      - name: Run host test suites
        # rake ti:test auto-clones the pinned engine into vendor/picoruby-ti
        # (public HTTPS, see lib/add/PICORUBY_TI_PIN) on first use.
        run: rake test

  spinel-gen:
    # Spinel code generation for every Ruby program that can be built on that
    # engine (kernel, desktop, editor), on the runner's own gcc -- no docker.
    # Generation alone catches the class of breakage that kept the Spinel
    # desktop unbuildable for two weeks: a C API added to the mruby bindings
    # and not to the Spinel base (doc/spinel_aot/report/desktop_spinel_gap.md).
    # The C compile is build-linux (spinel)'s job; this one exists because it
    # answers in about a minute without docker, and the generator stops at
    # the first missing method or inference gap.
    name: spinel-gen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix file permissions
        run: sudo chown -R $(id -u):$(id -g) .

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install Ruby dependencies
        run: gem install serialport

      - name: Generate Spinel C for kernel, desktop and editor
        # rake spinel:gen self-provisions the pinned compiler into vendor/spinel
        # (components/fmrb_spinel_rt/SPINEL_PIN) on a fresh checkout.
        env:
          FMRB_KERNEL_ENGINE: spinel
          FMRB_APP_ENGINE_DESKTOP: spinel
          FMRB_APP_ENGINE_EDITOR: spinel
        run: rake spinel:gen

  build-linux:
    # Once per engine configuration. "mruby" is the default build; "spinel"
    # puts the kernel, the desktop and the editor on Spinel. The second leg is
    # what spinel-gen cannot do: compile the generated C. A branch whose
    # arms end in a void leaf and a FmrbGfx, say, passes the generator and
    # fails only here (doc/spinel_aot/report/desktop_spinel_gap.md).
    name: build-linux (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [mruby, spinel]
    env:
      FMRB_KERNEL_ENGINE: ${{ matrix.engine }}
      FMRB_APP_ENGINE_DESKTOP: ${{ matrix.engine }}
      FMRB_APP_ENGINE_EDITOR: ${{ matrix.engine }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix file permissions
        run: sudo chown -R $(id -u):$(id -g) .

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install Ruby dependencies
        run: gem install serialport

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract repository owner (lowercase)
        id: repo_owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Load version from .env
        id: version
        run: echo "ESP_IDF_VERSION=$(grep ESP_IDF_VERSION .env | cut -d '=' -f2)" >> $GITHUB_OUTPUT

      - name: Pull Docker image from GHCR
        run: docker pull ghcr.io/${{ steps.repo_owner.outputs.owner }}/fmruby-esp32-build:${{ steps.version.outputs.ESP_IDF_VERSION }}

      - name: Tag image for Rakefile
        run: docker tag ghcr.io/${{ steps.repo_owner.outputs.owner }}/fmruby-esp32-build:${{ steps.version.outputs.ESP_IDF_VERSION }} esp32_build_container:${{ steps.version.outputs.ESP_IDF_VERSION }}

      - name: Build Linux target
        run: rake build:linux

      # - name: Upload Linux artifacts
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: fmruby-core-linux
      #     path: build/fmruby-core.elf
      #     retention-days: 7

