# The distribution's settings (a newer release than old/).
system_name = "Family mruby OS (Native)"
display_width = 426
max_apps = 32
debug_mode = true
keyboard_layout = "us" # changed by the user
language = "ja"
# my own note
boot_splash = false

audio_mute = true
audio_volume = 3

# Where Asterism / Zenoh apps find the router.
zenoh_router = "tcp/127.0.0.1:7447"
greeting = """
multi-line [ value
"""
wallpaper = ""

[theme]
desktop_bg = 0x12
menu_bg = 0xC5
dir_color = 0x03

[[shortcuts]]
key = "x"
app = "default/shell"

[clock_face]
style = "digital"
seconds = [
  true,
]

# Hidden from the launcher.
[[launcher_exclude]]
dir = "debug"

[[launcher_exclude]]
dir = "test"
